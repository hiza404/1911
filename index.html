<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Happy Boy's Day 19/11 💙 | Chúc Mừng Ngày Quốc Tế Nam Giới</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      body {
        background: radial-gradient(
          circle at 50% 35%,
          #eff6ff 0%,
          #bfdbfe 30%,
          #60a5fa 65%,
          #1d4ed8 100%
        );

        display: flex;
        justify-content: center;
        align-items: center;

        position: relative;
      }

      /* =========================
           BACKGROUND ICONS
        ========================= */

      .heart {
        position: absolute;
        bottom: -50px;

        color: rgba(255, 255, 255, 0.85);

        font-size: 22px;

        animation: heartFloat linear infinite;

        pointer-events: none;
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.5));
      }

      @keyframes heartFloat {
        0% {
          transform: translateY(0) rotate(0deg) scale(0.8);

          opacity: 0;
        }

        15% {
          opacity: 1;
        }

        100% {
          transform: translateY(-110vh) rotate(360deg) scale(1.4);

          opacity: 0;
        }
      }

      /* =========================
           MAIN
        ========================= */

      .welcome {
        width: min(92%, 550px);

        text-align: center;

        position: relative;
        z-index: 10;

        animation: welcomeShow 1.2s ease;
      }

      @keyframes welcomeShow {
        from {
          opacity: 0;
          transform: translateY(40px) scale(0.9);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* =========================
           TOP TEXT
        ========================= */

      .small-title {
        color: #ffffff;

        font-size: 18px;

        letter-spacing: 4px;

        margin-bottom: 12px;

        text-shadow: 0 3px 10px rgba(15, 23, 42, 0.35);
      }

      .main-title {
        color: #ffffff;

        font-size: clamp(38px, 9vw, 70px);

        font-weight: 900;

        line-height: 1;

        text-shadow:
          0 5px 0 #1e40af,
          0 8px 25px rgba(15, 23, 42, 0.4);

        margin-bottom: 15px;
      }

      .name {
        color: #fef08a;

        font-size: clamp(25px, 6vw, 42px);

        font-weight: bold;

        margin-bottom: 35px;

        letter-spacing: 2px;

        text-shadow: 0 3px 15px rgba(30, 58, 138, 0.5);
      }

      /* =========================
           GIFT
        ========================= */

      .gift-area {
        position: relative;

        width: 190px;
        height: 180px;

        margin: 0 auto 30px;

        cursor: pointer;

        transition: 0.3s ease;
      }

      .gift-area:hover {
        transform: scale(1.08);
      }

      .gift-box {
        position: absolute;

        left: 20px;
        bottom: 0;

        width: 150px;
        height: 110px;

        background: linear-gradient(135deg, #1d4ed8, #3b82f6);

        border-radius: 8px 8px 15px 15px;

        box-shadow: 0 15px 30px rgba(15, 23, 42, 0.35);
      }

      .gift-box::before {
        content: "";

        position: absolute;

        left: 62px;
        top: 0;

        width: 25px;
        height: 110px;

        background: linear-gradient(to right, #f59e0b, #fbbf24, #f59e0b);
      }

      .gift-box::after {
        content: "";

        position: absolute;

        left: 0;
        top: 40px;

        width: 150px;
        height: 24px;

        background: linear-gradient(to bottom, #fbbf24, #f59e0b);
      }

      .gift-lid {
        position: absolute;

        left: 10px;
        top: 35px;

        width: 170px;
        height: 35px;

        background: #1e40af;

        border-radius: 8px;

        z-index: 3;

        box-shadow: 0 5px 12px rgba(15, 23, 42, 0.3);
      }

      /* =========================
           BOW
        ========================= */

      .bow {
        position: absolute;

        left: 68px;
        top: 0;

        width: 55px;
        height: 45px;

        z-index: 5;
      }

      .bow-left,
      .bow-right {
        position: absolute;

        width: 34px;
        height: 34px;

        background: #fbbf24;

        border-radius: 50% 50% 10% 50%;
      }

      .bow-left {
        left: 0;
        transform: rotate(-35deg);
      }

      .bow-right {
        right: 0;
        transform: rotate(35deg);
      }

      .bow-center {
        position: absolute;

        left: 20px;
        top: 10px;

        width: 18px;
        height: 25px;

        background: #d97706;

        border-radius: 50%;

        z-index: 2;
      }

      /* =========================
           BUTTON
        ========================= */

      .open-text {
        color: #ffffff;

        font-size: 18px;

        margin-bottom: 18px;

        text-shadow: 0 2px 8px rgba(15, 23, 42, 0.4);

        animation: pulse 1.8s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.06);
        }
      }

      .open-button {
        border: none;

        background: #ffffff;

        color: #1d4ed8;

        padding: 16px 38px;

        border-radius: 50px;

        font-size: 17px;

        font-weight: bold;

        cursor: pointer;

        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.3);

        transition: 0.3s ease;
      }

      .open-button:hover {
        transform: translateY(-3px) scale(1.05);

        box-shadow: 0 15px 35px rgba(15, 23, 42, 0.4);
        background: #f8fafc;
      }

      /* =========================
           SPARKLES
        ========================= */

      .sparkle {
        position: absolute;

        color: #ffffff;

        font-size: 25px;

        animation: sparkle 2s infinite;
      }

      .sparkle1 {
        top: 12%;
        left: 15%;
      }

      .sparkle2 {
        top: 25%;
        right: 13%;

        animation-delay: 0.5s;
      }

      .sparkle3 {
        bottom: 20%;
        left: 10%;

        animation-delay: 1s;
      }

      .sparkle4 {
        bottom: 15%;
        right: 12%;

        animation-delay: 1.5s;
      }

      @keyframes sparkle {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(0.7) rotate(0deg);
        }

        50% {
          opacity: 1;
          transform: scale(1.3) rotate(180deg);
        }
      }

      /* =========================
           MOBILE
        ========================= */

      @media (max-width: 600px) {
        .small-title {
          font-size: 14px;
        }

        .name {
          margin-bottom: 25px;
        }

        .gift-area {
          transform: scale(0.9);
        }

        .gift-area:hover {
          transform: scale(0.95);
        }
      }
    </style>
  </head>

  <body>
    <!-- =========================
         BACKGROUND ICONS
    ========================= -->

    <span class="heart" style="left: 6%; animation-duration: 7s">💙</span>
    <span
      class="heart"
      style="left: 18%; animation-duration: 9s; animation-delay: 1.5s"
      >⭐</span
    >
    <span
      class="heart"
      style="left: 32%; animation-duration: 8s; animation-delay: 0.5s"
      >👑</span
    >
    <span
      class="heart"
      style="left: 48%; animation-duration: 10s; animation-delay: 2.5s"
      >✨</span
    >
    <span
      class="heart"
      style="left: 65%; animation-duration: 8.5s; animation-delay: 1s"
      >💙</span
    >
    <span
      class="heart"
      style="left: 78%; animation-duration: 9s; animation-delay: 3s"
      >⚡</span
    >
    <span
      class="heart"
      style="left: 90%; animation-duration: 7.5s; animation-delay: 0.8s"
      >⭐</span
    >
    <span
      class="heart"
      style="left: 96%; animation-duration: 8s; animation-delay: 2s"
      >🎉</span
    >

    <!-- =========================
         SPARKLES
    ========================= -->

    <div class="sparkle sparkle1">✦</div>
    <div class="sparkle sparkle2">✧</div>
    <div class="sparkle sparkle3">✦</div>
    <div class="sparkle sparkle4">✧</div>

    <!-- =========================
         WELCOME
    ========================= -->

    <main class="welcome">
      <div class="small-title">★ MÓN QUÀ ĐẶC BIỆT DÀNH TẶNG ★</div>

      <h1 class="main-title">HAPPY BOY'S DAY</h1>

      <div class="name">19 . 11 . 2026 💙</div>

      <!-- =========================
             GIFT
        ========================= -->

      <div class="gift-area" id="openGift">
        <div class="bow">
          <div class="bow-left"></div>
          <div class="bow-right"></div>
          <div class="bow-center"></div>
        </div>

        <div class="gift-lid"></div>

        <div class="gift-box"></div>
      </div>

      <div class="open-text">🎁 Có một món quà đặc biệt đang chờ anhhhh...</div>

      <button class="open-button" id="openButton">Mở quà ngay 💙</button>
    </main>

    <script>
      const openGift = document.getElementById("openGift");
      const openButton = document.getElementById("openButton");

      function openBirthday() {
        sessionStorage.setItem("birthdayMusic", "play");
        sessionStorage.setItem("boydayMusic", "play");

        document.body.style.transition =
          "opacity 0.8s ease, transform 0.8s ease";

        document.body.style.opacity = "0";

        document.body.style.transform = "scale(1.05)";

        setTimeout(function () {
          window.location.href = "./birthday.html";
        }, 800);
      }

      openGift.addEventListener("click", openBirthday);
      openButton.addEventListener("click", openBirthday);
    </script>
  </body>
</html>
