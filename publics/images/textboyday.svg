<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#93c5fd" />
      <stop offset="65%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Top Crown -->
    <g transform="translate(300, 75)" filter="url(#glow)">
      <path d="M -45 10 L -35 -25 L -10 -5 L 0 -35 L 10 -5 L 35 -25 L 45 10 Z" fill="url(#goldGrad)" stroke="#d97706" stroke-width="2" />
      <circle cx="-35" cy="-25" r="4" fill="#fff" />
      <circle cx="0" cy="-35" r="5" fill="#fff" />
      <circle cx="35" cy="-25" r="4" fill="#fff" />
      <circle cx="0" cy="0" r="3.5" fill="#ef4444" />
      <circle cx="-20" cy="3" r="3" fill="#3b82f6" />
      <circle cx="20" cy="3" r="3" fill="#3b82f6" />
    </g>

    <!-- Sparkles -->
    <path d="M 140 100 Q 150 110 160 110 Q 150 110 140 120 Q 150 110 140 100" fill="#fde047" />
    <path d="M 460 90 Q 470 100 480 100 Q 470 100 460 110 Q 470 100 460 90" fill="#fde047" />
    <circle cx="175" cy="145" r="3" fill="#fff" />
    <circle cx="435" cy="135" r="4" fill="#fff" />

    <!-- HAPPY Text -->
    <text x="300" y="150" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="44" font-weight="900" letter-spacing="8" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" filter="url(#glow)">
      HAPPY
    </text>

    <!-- 3D Shadow for BOY'S DAY -->
    <text x="300" y="246" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="72" font-weight="900" letter-spacing="3" fill="#0f172a">
      BOY'S DAY
    </text>
    <text x="300" y="243" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="72" font-weight="900" letter-spacing="3" fill="#1e3a8a">
      BOY'S DAY
    </text>
    <!-- Main BOY'S DAY Text -->
    <text x="300" y="240" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="72" font-weight="900" letter-spacing="3" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="3">
      BOY'S DAY
    </text>

    <!-- Subtitle Ribbon Badge -->
    <g transform="translate(300, 310)">
      <path d="M -170 -22 L 170 -22 L 155 0 L 170 22 L -170 22 L -155 0 Z" fill="url(#cyanGrad)" stroke="#bae6fd" stroke-width="2" />
      <text x="0" y="7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" letter-spacing="4" fill="#ffffff">
        ★ 19 . 11 ★
      </text>
    </g>

    <!-- Tagline below -->
    <text x="300" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" letter-spacing="4" fill="#1e40af">
      QUỐC TẾ NAM GIỚI
    </text>
  </g>
</svg>